<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Razorpay payment journey in InsForge</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g class="c-gray"><rect x="20" y="20" width="100" height="36" rx="8" stroke-width="0.5" fill="#f3f4f6" stroke="#9ca3af"/><text class="th" x="70" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="bold" font-size="14" fill="#374151">Frontend</text></g>
<g class="c-teal"><rect x="190" y="20" width="140" height="36" rx="8" stroke-width="0.5" fill="#f0fdfa" stroke="#14b8a6"/><text class="th" x="260" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="bold" font-size="14" fill="#0f766e">InsForge backend</text></g>
<g class="c-purple"><rect x="400" y="20" width="120" height="36" rx="8" stroke-width="0.5" fill="#faf5ff" stroke="#a855f7"/><text class="th" x="460" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="bold" font-size="14" fill="#7e22ce">Razorpay</text></g>
<g class="c-coral"><rect x="560" y="20" width="100" height="36" rx="8" stroke-width="0.5" fill="#fff1f2" stroke="#fb7185"/><text class="th" x="610" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-weight="bold" font-size="14" fill="#be123c">App tables</text></g>
<line x1="70" y1="56" x2="70" y2="530" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="260" y1="56" x2="260" y2="530" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="460" y1="56" x2="460" y2="530" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="610" y1="56" x2="610" y2="530" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="70" y1="90" x2="258" y2="90" class="arr" marker-end="url(#arrow)" stroke="#6b7280"/>
<text class="ts" x="164" y="84" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">createCheckoutSession()</text>
<rect x="210" y="108" width="100" height="24" rx="4" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
<text class="ts" x="260" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#4b5563">Advisory lock + insert row</text>
<line x1="260" y1="155" x2="458" y2="155" class="arr" marker-end="url(#arrow)" stroke="#6b7280"/>
<text class="ts" x="359" y="149" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Create order / subscription</text>
<line x1="458" y1="185" x2="262" y2="185" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3" stroke="#6b7280"/>
<text class="ts" x="359" y="179" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Return order ID + checkout URL</text>
<line x1="258" y1="215" x2="72" y2="215" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3" stroke="#6b7280"/>
<text class="ts" x="164" y="209" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Return checkout URL</text>
<line x1="70" y1="248" x2="458" y2="248" class="arr" marker-end="url(#arrow)" stroke="#6b7280"/>
<text class="ts" x="264" y="242" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Redirect user to Razorpay checkout</text>
<rect x="380" y="260" width="160" height="22" rx="4" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
<text class="ts" x="460" y="271" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#4b5563">User completes payment</text>
<line x1="458" y1="298" x2="72" y2="298" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3" stroke="#6b7280"/>
<text class="ts" x="264" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Redirect to success URL (UX only)</text>
<line x1="458" y1="330" x2="262" y2="330" class="arr" marker-end="url(#arrow)" stroke="#6b7280"/>
<text class="ts" x="359" y="324" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Webhook event fired</text>
<rect x="210" y="342" width="100" height="24" rx="4" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
<text class="ts" x="260" y="354" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#4b5563">HMAC verify + deduplicate</text>
<line x1="260" y1="382" x2="608" y2="382" class="arr" marker-end="url(#arrow)" stroke="#6b7280"/>
<text class="ts" x="434" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Project payment state</text>
<rect x="560" y="394" width="100" height="36" rx="4" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
<text class="ts" x="610" y="412" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#4b5563">Run fulfillment logic</text>
<line x1="608" y1="448" x2="72" y2="448" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3" stroke="#6b7280"/>
<text class="ts" x="340" y="442" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">Updated billing state available</text>
<line x1="30" y1="500" x2="70" y2="500" class="arr" marker-end="url(#arrow)" stroke="#6b7280"/>
<text class="ts" x="80" y="504" font-family="sans-serif" font-size="12" fill="#4b5563">Request</text>
<line x1="150" y1="500" x2="190" y2="500" class="arr" marker-end="url(#arrow)" stroke-dasharray="5 3" stroke="#6b7280"/>
<text class="ts" x="200" y="504" font-family="sans-serif" font-size="12" fill="#4b5563">Response</text>
</svg>
